[package]
name = "albumbox-indexer"
version.workspace = true
edition.workspace = true

[dependencies]
albumbox-core.workspace = true
albumbox-faces.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
time.workspace = true
blake3 = "1"
walkdir = "2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
kamadak-exif = "0.6"
imagesize = "0.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "rayon"] }
fast_image_resize = { version = "5", features = ["image"] }

[dev-dependencies]
tempfile = "3"
sqlx.workspace = true
