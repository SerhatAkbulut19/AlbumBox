[workspace]
resolver = "2"
members = ["crates/albumbox-core", "crates/albumbox-faces", "crates/albumbox-indexer", "crates/albumbox-api"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
albumbox-core = { path = "crates/albumbox-core" }
albumbox-indexer = { path = "crates/albumbox-indexer" }
albumbox-faces = { path = "crates/albumbox-faces" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tracing = "0.1"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros", "local-offset"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
